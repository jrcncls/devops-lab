---
- name: Verify connectivity to managed hosts
  hosts: all
  gather_facts: false

  tasks:
    - name: Ping the hosts
      ansible.builtin.ping:

    - name: Display hostname
      ansible.builtin.command: hostname
      register: hostname_output
      changed_when: false
    
    - name: Show hostname
      ansible.builtin.debug:
        msg: "{{ hostname_output.stdout }}"